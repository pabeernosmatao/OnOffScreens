[package]
name = "onoffscreens"
version = "2.1.0"
description = "Perfiles de monitores para KDE Plasma"
authors = ["OnOffScreens"]
license = "0BSD"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "onoffscreens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
